name: Deploy proctor site

# Publishes the site to GitHub Pages. The build itself runs on your machine
# (sync.cmd), because the source workbook lives in OneDrive and is not part of
# this repository.
#
# CLOSED 2026-09-25. The automatic push trigger is switched off, so an ordinary
# commit no longer republishes anything. What is live is the closing notice.
# To reopen for the next exam period, put the push trigger back:
#
#   on:
#     push:
#       branches: [main]
#     workflow_dispatch:
#
# Until then the workflow can still be run by hand from the Actions tab, which
# is how you would redeploy without reopening the automation.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fail if the site was never built
        run: test -f index.html || { echo "index.html is missing - run sync.cmd"; exit 1; }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
