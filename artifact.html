    --surface:    #161B23;

    --accent:     #62CFC6;
    --accent-ink: #A6E5DE;
    --accent-soft:#15302E;
    --on-accent:  #07201E;
    --ok:         #6FD09B;
    --ok-soft:    #14301F;
    --warn:       #E8A85A;
    --warn-soft:  #33240F;
    --crit:       #F08D84;

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 940px; margin: 0 auto; padding: 0 16px 80px; }

  /* ---------- header ---------- */
  header.top {
    position: sticky; top: 0; z-index: 40;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  .top-in {
    max-width: 940px; margin: 0 auto; padding: 14px 16px 0;
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px;
  }
  h1 { font-size: 19px; font-weight: 700; margin: 0; letter-spacing: -.015em; text-wrap: balance; }
  h1 .sub { color: var(--muted); font-weight: 500; }
  .stamp { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-left: auto; white-space: nowrap; }

  /* ---------- status pills ---------- */
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 600; letter-spacing: .01em;
    padding: 3px 10px 3px 8px; border-radius: 999px;
    border: 1px solid transparent; white-space: nowrap;
  }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
  .pill.ok   { color: var(--ok);   background: var(--ok-soft);   border-color: color-mix(in srgb, var(--ok) 28%, transparent); }
  .pill.warn { color: var(--warn); background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 28%, transparent); }
  .pill.crit { color: var(--crit); background: var(--crit-soft); border-color: color-mix(in srgb, var(--crit) 28%, transparent); }

  /* ---------- tabs ---------- */
  nav.modes { max-width: 940px; margin: 0 auto; padding: 10px 16px 0; display: flex; gap: 2px; overflow-x: auto; }
  nav.modes button {
    appearance: none; background: none; border: 0; border-bottom: 2px solid transparent;
    font: inherit; font-size: 14px; font-weight: 500; color: var(--muted);
    padding: 8px 12px 10px; cursor: pointer; white-space: nowrap;
    transition: color .12s ease, border-color .12s ease;
  }
  nav.modes button:hover { color: var(--ink-2); }
  nav.modes button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  nav.modes button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 4px; }

  /* ---------- generic ---------- */
  .panel { padding-top: 22px; }
  .lede { color: var(--muted); font-size: 14px; margin: 0 0 16px; max-width: 64ch; }
  .eyebrow {
    font-family: var(--mono); font-size: 11px; font-weight: 500;
    letter-spacing: .09em; text-transform: uppercase; color: var(--muted);
  }

  /* ---------- combobox ---------- */
  .combo { position: relative; max-width: 480px; }
  .combo-field {
    display: flex; align-items: center; gap: 9px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 0 12px; box-shadow: var(--shadow);
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  .combo-field:focus-within { border-color: var(--accent); box-shadow: var(--shadow), 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .combo-field svg { flex: none; color: var(--muted); }
  .combo-field input {
    flex: 1; min-width: 0; font: inherit; color: var(--ink);
    background: none; border: 0; outline: none; padding: 11px 0;
  }
  .combo-field input::placeholder { color: var(--muted); }
  .combo-field input::-webkit-search-cancel-button { display: none; }
  .combo-toggle {
    appearance: none; background: none; border: 0; cursor: pointer;
    font: inherit; font-size: 12px; font-weight: 500; color: var(--muted);
    padding: 4px 2px 4px 8px; white-space: nowrap; border-left: 1px solid var(--line);
  }
  .combo-toggle:hover { color: var(--accent); }
  .combo-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  .combo-list {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 60;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 11px; box-shadow: var(--shadow-pop);
    max-height: 306px; overflow-y: auto; padding: 5px;
  }
  .opt {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 8px; cursor: pointer;
    font-size: 14px; color: var(--ink-2);
  }
  .opt:hover, .opt.active { background: var(--accent-soft); color: var(--accent-ink); }
  .opt .mono-n {
    margin-left: auto; font-family: var(--mono); font-size: 11px;
    color: var(--muted); background: var(--surface-2);
    border-radius: 5px; padding: 1px 6px; min-width: 20px; text-align: center;
  }
  .opt .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .opt .role { display: block; font-size: 11.5px; color: var(--muted); }
  .opt.none { color: var(--muted); cursor: default; justify-content: center; padding: 16px; }
  .opt.none:hover { background: none; }

  /* ---------- monogram + selected header ---------- */
  .mono {
    flex: none; width: 42px; height: 42px; border-radius: 12px;
    display: grid; place-items: center;
    background: var(--accent); color: var(--on-accent);
    font-size: 14.5px; font-weight: 600; letter-spacing: .02em;
  }
  .mono.sq { border-radius: 10px; background: var(--accent-soft); color: var(--accent-ink); font-family: var(--mono); font-size: 12px; }
  .chosen {
    display: flex; align-items: center; gap: 13px; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 13px; padding: 14px 16px; margin-top: 18px; box-shadow: var(--shadow);
  }
  .chosen .who { min-width: 0; flex: 1 1 200px; }
  .chosen .who .nm { font-size: 17px; font-weight: 600; letter-spacing: -.015em; }
  .chosen .who .sm { font-size: 12.5px; color: var(--muted); }
  .chosen .acts { display: flex; gap: 7px; flex-wrap: wrap; }

  /* ---------- stat strip ---------- */
  .strip {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
    gap: 1px; background: var(--line-soft);
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    margin: 10px 0 0; box-shadow: var(--shadow);
  }
  .strip .cell { background: var(--surface); padding: 12px 14px; }
  .strip .k { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .strip .v { font-size: 21px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: 3px; }
  .strip .v.sm { font-size: 14px; font-weight: 500; letter-spacing: 0; line-height: 1.35; }

  /* ---------- day strip ---------- */
  .days-wrap { margin-top: 20px; }
  .days {
    display: flex; gap: 7px; overflow-x: auto;
    padding: 9px 1px 12px; scrollbar-width: thin;
  }
  .day {
    flex: 0 0 auto; width: 62px; text-align: center;
    border: 1px solid var(--line); border-radius: 11px;
    background: var(--surface); padding: 8px 4px 7px;
    font: inherit; color: var(--ink-2); cursor: default;
    transition: border-color .12s ease, background .12s ease, transform .12s ease;
  }
  button.day { cursor: pointer; }
  button.day:hover { border-color: var(--accent); transform: translateY(-1px); }
  button.day:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .day .wd, .day .dn, .day .mo { display: block; }
  .day .wd { font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .day .dn { font-size: 19px; font-weight: 600; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .day .mo { font-family: var(--mono); font-size: 9.5px; color: var(--muted); text-transform: uppercase; }
  .day .bar { display: flex; gap: 2px; justify-content: center; margin-top: 6px; min-height: 5px; }
  .day .bar i { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); opacity: .42; }
  .day.mine { border-color: var(--accent); background: var(--accent-soft); }
  .day.mine .dn, .day.mine .wd, .day.mine .mo { color: var(--accent-ink); }
  .day.mine .bar i { background: var(--accent); opacity: 1; }
  .day.short { border-color: color-mix(in srgb, var(--crit) 45%, transparent); }
  .day.short .bar i { background: var(--crit); opacity: 1; }
  .day.blank { opacity: .4; }
  .day[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
  .day[aria-pressed="true"] .dn, .day[aria-pressed="true"] .wd, .day[aria-pressed="true"] .mo { color: var(--on-accent); }
  .day[aria-pressed="true"] .bar i { background: var(--on-accent); opacity: .9; }
  .day .today-dot { display: block; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); margin: 3px auto 0; }

  /* ---------- date groups + cards ---------- */
  .daygroup { margin-top: 24px; }
  .dayhead {
    display: flex; align-items: baseline; gap: 10px;
    padding-bottom: 7px; margin-bottom: 10px; border-bottom: 1px solid var(--line);
  }
  .dayhead .d { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--ink); letter-spacing: -.01em; }
  .dayhead .w { font-size: 12.5px; color: var(--muted); }
  .dayhead .rel { margin-left: auto; font-size: 11.5px; font-weight: 600; color: var(--accent); }

  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 13px 15px; margin-bottom: 9px;
    box-shadow: var(--shadow); display: grid; gap: 9px;
  }
  .card.past { opacity: .55; box-shadow: none; }
  .card-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  .card h3 { margin: 0; font-size: 15.5px; font-weight: 600; letter-spacing: -.012em; text-wrap: balance; }
  .card .meta { display: flex; flex-wrap: wrap; gap: 3px 14px; font-size: 12.5px; color: var(--muted); }
  .card .meta b { font-weight: 500; color: var(--ink-2); }
  .card .meta .m { font-family: var(--mono); font-variant-numeric: tabular-nums; }

    font-family: var(--mono); font-size: 10.5px; font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase;

    border-radius: 5px; padding: 2px 6px;

  .procs { border-top: 1px dashed var(--line); padding-top: 10px; }
  .plist { list-style: none; margin: 7px 0 0; padding: 0; display: grid; gap: 4px; }
  .plist li {
    display: flex; align-items: center; gap: 10px;
    font-size: 13.5px; color: var(--ink-2);

    border-radius: 8px; padding: 5px 10px;

  .plist .pn {

  .plist li.me {
    background: var(--accent-soft); color: var(--accent-ink);

  }
  .plist li.me .pn { color: var(--accent); }
  .plist li.gap {
    background: var(--crit-soft); color: var(--crit);

  }
  .plist li.gap .pn { color: var(--crit); }
  .cardfoot { display: flex; justify-content: flex-end; }
  .gcal { font-size: 12px; color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .gcal:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .gcal:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

  /* ---------- misc ---------- */
  .rowbtn {
    appearance: none; font: inherit; font-size: 13px; cursor: pointer;
    background: var(--surface); color: var(--ink-2);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px;
  }
  .rowbtn:hover { border-color: var(--accent); color: var(--accent); }
  .rowbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; align-items: center; }
  .fbtn {
    appearance: none; font: inherit; font-size: 13px; cursor: pointer;
    background: var(--surface); color: var(--ink-2);
    border: 1px solid var(--line); border-radius: 8px; padding: 5px 11px;
  }
  .fbtn:hover { border-color: var(--accent); color: var(--ink); }
  .fbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .fbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .filters .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }

  .hint {
    display: grid; gap: 5px; justify-items: center; text-align: center;
    border: 1px dashed var(--line); border-radius: 12px;
    padding: 30px 20px; color: var(--muted); font-size: 14px; margin-top: 18px;
  }
  .hint .big { font-size: 15px; font-weight: 600; color: var(--ink-2); }
  .empty { border: 1px dashed var(--line); border-radius: 12px; padding: 26px 18px; text-align: center; color: var(--muted); font-size: 14px; }

  @media (max-width: 560px) {
    h1 { font-size: 17px; }
    .stamp { margin-left: 0; width: 100%; }
    .strip { grid-template-columns: repeat(2, 1fr); }
    .chosen .acts { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  @media print {
    header.top { position: static; }
    nav.modes, .combo, .filters, .gcal, .chosen .acts, .days-wrap { display: none !important; }
    .card, .strip { box-shadow: none; break-inside: avoid; }
  }
</style>

      if (opts.interactive) {
        return '<button class="' + cls.join(" ") + '" data-day="' + iso + '" aria-pressed="' +
          (state.day === iso) + '" title="' + on.length + ' exam' + (on.length === 1 ? "" : "s") + '">' +
          inner + "</button>";
      }
      return '<div class="' + cls.join(" ") + '" title="' + on.length + ' exam' +
        (on.length === 1 ? "" : "s") + '">' + inner + "</div>";
    }).join("");

    return '<div class="days-wrap"><span class="eyebrow">' + esc(opts.label || "Exam period") +
      '</span><div class="days">' + cells + "</div></div>";
  }

  /* ---------- combobox ---------- */
  // Options stay hidden until the person types or asks to browse, so the page
  // never opens with a wall of names.
  function combo(cfg) {
    return '<div class="combo" data-combo="' + cfg.kind + '">' +
      '<div class="combo-field">' + SEARCH_ICON +
        '<input type="text" id="combo-input" autocomplete="off" role="combobox" ' +
        'aria-expanded="false" aria-controls="combo-list" aria-autocomplete="list" ' +
        'placeholder="' + esc(cfg.placeholder) + '" value="">' +
        '<button type="button" class="combo-toggle" id="combo-toggle">Browse all ' + cfg.total + "</button>" +
      "</div>" +
      '<div class="combo-list" id="combo-list" role="listbox" hidden></div>' +
    "</div>";
  }

  function comboOptions(kind, q) {
    q = (q || "").toLowerCase();
    if (kind === "person") {
      return DATA.proctorIndex
        .filter(function (p) { return !q || p.name.toLowerCase().indexOf(q) > -1; })
        .map(function (p) {
          return { value: p.name, label: p.name, count: p.count,
                   sub: p.count ? "" : "no duties in this period" };
        });
    }
    return DATA.courseIndex
      .filter(function (c) {
        return !q || c.course.toLowerCase().indexOf(q) > -1 ||
               (c.coordinator || "").toLowerCase().indexOf(q) > -1;
      })
      .map(function (c) {
        return { value: c.course, label: c.course, count: c.sittings.length, sub: c.coordinator || "" };
      });
  }

  function paintCombo(kind, q) {
    var list = document.getElementById("combo-list");
    if (!list) return;
    var opts = comboOptions(kind, q);
    list.innerHTML = opts.length
      ? opts.map(function (o, i) {
          return '<div class="opt' + (i === 0 ? " active" : "") + '" role="option" aria-selected="false" ' +
            'data-value="' + esc(o.value) + '"><span class="who">' + esc(o.label) +
            (o.sub ? '<span class="role">' + esc(o.sub) + "</span>" : "") +
            '</span><span class="mono-n">' + o.count + "</span></div>";
        }).join("")
      : '<div class="opt none">Nothing matches that.</div>';
  }

  function openCombo(kind, q) {
    var list = document.getElementById("combo-list");
    var input = document.getElementById("combo-input");
    if (!list) return;
    paintCombo(kind, q);
    list.hidden = false;
    if (input) input.setAttribute("aria-expanded", "true");
  }
  function closeCombo() {
    var list = document.getElementById("combo-list");
    var input = document.getElementById("combo-input");
    if (list) list.hidden = true;
    if (input) input.setAttribute("aria-expanded", "false");
  }

  /* ---------- state ---------- */
  var state = { mode: "me", person: "", course: "", q: "", dept: "", scope: "upcoming", day: "" };

  function readHash() {
    var m = decodeURIComponent(location.hash.replace(/^#/, "")).match(/^(p|c)=([\s\S]*)$/);
    if (!m) return;
    if (m[1] === "p") { state.mode = "me"; state.person = m[2]; }
    else { state.mode = "course"; state.course = m[2]; }
  }
  function writeHash() {
    var h = "";
    if (state.mode === "me" && state.person) h = "#p=" + encodeURIComponent(state.person);
    else if (state.mode === "course" && state.course) h = "#c=" + encodeURIComponent(state.course);
    try { history.replaceState(null, "", h || (location.pathname + location.search)); }
    catch (err) { /* a sandboxed host may block history writes */ }
  }

  /* ---------- panels ---------- */
  function panelMe() {
    var h = '<p class="lede">Find your name to see every exam you are proctoring. ' +
      "Once you are selected the address bar becomes your own link — copy it and it reopens " +
      "straight to your duties.</p>";
    h += '<span class="eyebrow">Who are you?</span><div style="margin-top:7px">' +
      combo({ kind: "person", placeholder: "Type your name…", total: DATA.proctorIndex.length }) + "</div>";

    if (!state.person) {
      h += dayStrip({ label: "Exam period at a glance" });
      h += '<div class="hint"><span class="big">Nothing selected yet</span>' +
        "<span>Type your name above, or browse the list, to see your duties.</span></div>";
      return h;
    }

    var mine = DATA.exams.filter(function (e) { return e.proctors.indexOf(state.person) > -1; });
    var upcoming = mine.filter(function (e) { return !isPast(e); });
    var nxt = firstUpcoming(mine);
    var mineDays = {};
    mine.forEach(function (e) { mineDays[e.date] = 1; });

    h += '<div class="chosen"><span class="mono">' + esc(initials(state.person)) + "</span>" +
      '<span class="who"><span class="nm">' + esc(state.person) + "</span><br>" +
      '<span class="sm">' + (mine.length === 1 ? "1 duty" : mine.length + " duties") +
      " · " + hoursOf(mine) + " hours in the hall</span></span>" +
      '<span class="acts"><button class="rowbtn" id="copy">Copy my duties</button>' +
      '<button class="rowbtn" id="clear">Change</button></span></div>';

    h += '<div class="strip">' +
      '<div class="cell"><div class="k">Duties</div><div class="v">' + mine.length + "</div></div>" +
      '<div class="cell"><div class="k">Still to come</div><div class="v">' + upcoming.length + "</div></div>" +
      '<div class="cell"><div class="k">Next duty</div><div class="v sm">' +
        (nxt ? esc(prettyDate(nxt.date)) + "<br>" + esc(nxt.time) : "None left") + "</div></div>" +
      '<div class="cell"><div class="k">Hours</div><div class="v">' + hoursOf(mine) + "</div></div>" +
    "</div>";

    h += dayStrip({ label: "Your days are highlighted", mine: mineDays });
    h += groupByDate(mine, { highlight: state.person, gcal: true });
    return h;
  }

  function panelCourse() {
    var h = '<p class="lede">Coordinators: find your course to see who is proctoring each sitting, ' +
      "which rooms are booked, and how many students are expected.</p>";
    h += '<span class="eyebrow">Which course?</span><div style="margin-top:7px">' +
      combo({ kind: "course", placeholder: "Type a course or coordinator…", total: DATA.courseIndex.length }) + "</div>";

    if (!state.course) {
      h += dayStrip({ label: "Exam period at a glance" });
      h += '<div class="hint"><span class="big">No course selected</span>' +
        "<span>Type a course name or your own name to find its proctors.</span></div>";
      return h;
    }

    var sit = DATA.exams.filter(function (e) { return e.course === state.course; });
    var seats = sit.reduce(function (n, e) { return n + e.assigned; }, 0);
    var need = sit.reduce(function (n, e) { return n + (e.required || 0); }, 0);
    var people = {}, days = {};
    sit.forEach(function (e) {
      days[e.date] = 1;
      e.proctors.forEach(function (p) { people[p] = 1; });
    });
    var meta = sit[0] || {};

    h += '<div class="chosen"><span class="mono sq">' + esc(meta.dept || "—") + "</span>" +
      '<span class="who"><span class="nm">' + esc(state.course) + "</span><br>" +
      '<span class="sm">' + (meta.coordinator ? "Coordinator " + esc(meta.coordinator) : "No coordinator listed") +
      "</span></span>" +
      '<span class="acts"><button class="rowbtn" id="clear">Change</button></span></div>';

    h += '<div class="strip">' +
      '<div class="cell"><div class="k">Sittings</div><div class="v">' + sit.length + "</div></div>" +
      '<div class="cell"><div class="k">Proctor seats</div><div class="v">' + seats + " / " + need + "</div></div>" +
      '<div class="cell"><div class="k">People</div><div class="v">' + Object.keys(people).length + "</div></div>" +
      '<div class="cell"><div class="k">Students</div><div class="v">' +
        sit.reduce(function (n, e) { return n + (e.students || 0); }, 0) + "</div></div>" +
    "</div>";

    h += dayStrip({ label: "When it sits", mine: days });
    h += groupByDate(sit, {});
    return h;
  }

  function panelAll() {
    var q = state.q.toLowerCase();
    var depts = [];
    DATA.exams.forEach(function (e) { if (e.dept && depts.indexOf(e.dept) < 0) depts.push(e.dept); });
    depts.sort();

    var rows = DATA.exams.filter(function (e) {
      if (state.day && e.date !== state.day) return false;
      if (state.dept && e.dept !== state.dept) return false;
      if (!state.day) {
        if (state.scope === "upcoming" && isPast(e)) return false;
        if (state.scope === "past" && !isPast(e)) return false;
      }
      if (!q) return true;
      return (e.course + " " + e.coordinator + " " + e.room + " " + e.dept + " " + e.proctors.join(" "))
        .toLowerCase().indexOf(q) > -1;
    });

    var h = '<p class="lede">Every sitting in the exam period. Pick a day, or search by course, ' +
      "coordinator, room or proctor name.</p>";
    h += '<div class="combo"><div class="combo-field">' + SEARCH_ICON +
      '<input type="text" id="q" autocomplete="off" placeholder="e.g. N-301, Dana, Thermodynamics…" ' +
      'value="' + esc(state.q) + '"></div></div>';

    h += dayStrip({ label: "Jump to a day", interactive: true });

    h += '<div class="filters">';
    [["upcoming", "Upcoming"], ["all", "All"], ["past", "Done"]].forEach(function (s) {
      h += '<button class="fbtn" data-scope="' + s[0] + '" aria-pressed="' +
        (!state.day && state.scope === s[0]) + '">' + s[1] + "</button>";
    });
    h += '<span class="sep"></span>';
    h += '<button class="fbtn" data-dept="" aria-pressed="' + (!state.dept) + '">All departments</button>';
    depts.forEach(function (d) {
      h += '<button class="fbtn" data-dept="' + esc(d) + '" aria-pressed="' + (state.dept === d) + '">' + esc(d) + "</button>";
    });
    if (state.day) h += '<span class="sep"></span><button class="fbtn" data-day="">Clear day</button>';
    h += "</div>";

    h += '<p style="margin:20px 0 0"><span class="eyebrow">' + rows.length +
      " sitting" + (rows.length === 1 ? "" : "s") + " shown" +
      (state.day ? " on " + esc(prettyDate(state.day)) : "") + "</span></p>";
    h += groupByDate(rows, {});
    return h;
  }

  /* ---------- render ---------- */
  function render() {
    var nav = document.querySelector("nav.modes");
    Array.prototype.forEach.call(nav.querySelectorAll("button"), function (b) {
      b.setAttribute("aria-selected", String(b.dataset.mode === state.mode));
    });
    document.getElementById("panel").innerHTML =
      state.mode === "me" ? panelMe() : state.mode === "course" ? panelCourse() : panelAll();
    writeHash();
  }

  /* ---------- events ---------- */
  document.querySelector("nav.modes").addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-mode]");
    if (!b || b.dataset.mode === state.mode) return;
    state.mode = b.dataset.mode;
    state.q = ""; state.day = "";
    render();
  });

  var panel = document.getElementById("panel");
  var comboKind = function () { return state.mode === "me" ? "person" : "course"; };

  // Typing only repaints the dropdown, so the caret is never disturbed.
  panel.addEventListener("input", function (ev) {
    if (ev.target.id === "combo-input") {
      openCombo(comboKind(), ev.target.value);
    } else if (ev.target.id === "q") {
      state.q = ev.target.value;
      var caret = ev.target.selectionStart;
      render();
      var again = document.getElementById("q");
      if (again) { again.focus(); again.setSelectionRange(caret, caret); }
    }
  });

  panel.addEventListener("focusin", function (ev) {
    if (ev.target.id === "combo-input" && ev.target.value) openCombo(comboKind(), ev.target.value);
  });

  panel.addEventListener("keydown", function (ev) {
    if (ev.target.id !== "combo-input") return;
    var list = document.getElementById("combo-list");
    if (ev.key === "Escape") { closeCombo(); return; }
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      ev.preventDefault();
      if (!list || list.hidden) { openCombo(comboKind(), ev.target.value); return; }
      var opts = Array.prototype.slice.call(list.querySelectorAll(".opt:not(.none)"));
      if (!opts.length) return;
      var i = opts.findIndex(function (o) { return o.classList.contains("active"); });
      opts.forEach(function (o) { o.classList.remove("active"); });
      i = ev.key === "ArrowDown" ? (i + 1) % opts.length : (i - 1 + opts.length) % opts.length;
      opts[i].classList.add("active");
      opts[i].scrollIntoView({ block: "nearest" });
    } else if (ev.key === "Enter") {
      ev.preventDefault();
      var active = list && !list.hidden && list.querySelector(".opt.active");
      if (active) choose(active.dataset.value);
    }
  });

  function choose(value) {
    if (state.mode === "me") state.person = value; else state.course = value;
    closeCombo();
    render();
  }

  panel.addEventListener("click", function (ev) {
    var opt = ev.target.closest(".opt[data-value]");
    if (opt) { choose(opt.dataset.value); return; }

    var b = ev.target.closest("button");
    if (!b) return;

    if (b.id === "combo-toggle") {
      var list = document.getElementById("combo-list");
      var input = document.getElementById("combo-input");
      if (list && !list.hidden) { closeCombo(); }
      else { openCombo(comboKind(), input ? input.value : ""); if (input) input.focus(); }
    } else if (b.dataset.day !== undefined) {
      state.day = b.dataset.day === state.day ? "" : b.dataset.day;
      render();
    } else if (b.dataset.scope !== undefined) {
      state.scope = b.dataset.scope; state.day = ""; render();
    } else if (b.dataset.dept !== undefined) {
      state.dept = b.dataset.dept; render();
    } else if (b.id === "clear") {
      state.person = ""; state.course = ""; render();
      var inp = document.getElementById("combo-input");
      if (inp) inp.focus();
    } else if (b.id === "copy") {
      var mine = DATA.exams.filter(function (e) { return e.proctors.indexOf(state.person) > -1; });
      var txt = "Proctoring duties — " + state.person + "\n\n" + mine.map(function (e) {
        return prettyDate(e.date) + " (" + e.day + ")  " + e.time + "  " + e.course + "  — Room " + e.room;
      }).join("\n");
      var done = function (msg) {
        b.textContent = msg;
        setTimeout(function () { b.textContent = "Copy my duties"; }, 1800);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(function () { done("Copied"); },
                                                function () { done("Copy blocked"); });
      } else { done("Copy not supported"); }
    }
  });

  document.addEventListener("click", function (ev) {
    if (!ev.target.closest(".combo")) closeCombo();
  });

  window.addEventListener("hashchange", function () { readHash(); render(); });

  /* ---------- boot ---------- */
  var gen = new Date(DATA.generatedAt);
  var pad = function (n) { return (n < 10 ? "0" : "") + n; };
  document.getElementById("stamp").textContent =
    "updated " + gen.getDate() + " " + MONTHS[gen.getMonth()] + " " + pad(gen.getHours()) + ":" + pad(gen.getMinutes());

  readHash();
  render();
})();
</script>
