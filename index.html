<style>
  /* Light only, by request. Every colour is stated outright so the page holds
     its own look whatever ground the host paints behind it. */
  :root {
    color-scheme: light;
    --paper:      #FBFAF7;
    --paper-2:    #F4F2ED;
    --ink:        #1C2333;
    --ink-2:      #464F63;
    --ink-3:      #6E7789;
    --rule:       #E4E1DA;
    --rule-2:     #EFEDE7;
    --mark:       #FFD24A;
    --mark-deep:  #E0A800;
    --mark-soft:  #FFF4CE;
    --pen:        #C2412D;
    --pen-soft:   #FBE9E5;
    --sans: Karla, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: Fraunces, Georgia, "Times New Roman", serif;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .sheet { max-width: 760px; margin: 0 auto; padding: 0 22px 96px; }

  /* ---------- masthead ---------- */
  .masthead { padding: 46px 0 0; }
  h1 {
    font-family: var(--serif);
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: clamp(34px, 8vw, 52px);
    line-height: 1.02;
    letter-spacing: -.022em;
    margin: 0;
    text-wrap: balance;
  }
  .masthead .where {
    margin: 12px 0 0;
    font-size: 15.5px;
    color: var(--ink-3);
    max-width: 46ch;
  }
  .masthead .span {
    margin: 4px 0 0;
    font-size: 15.5px;
    color: var(--ink-2);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- name picker ---------- */
  .pick { position: relative; margin: 30px 0 0; }
  .pick-field {
    display: flex; align-items: center; gap: 12px;
    background: var(--paper-2);
    border: 1.5px solid var(--rule);
    border-radius: 3px;
    padding: 0 16px;
    transition: border-color .14s ease, background .14s ease;
  }
  .pick-field:focus-within { border-color: var(--ink); background: var(--paper); }
  .pick-field svg { flex: none; color: var(--ink-3); }
  .pick-field input {
    flex: 1; min-width: 0;
    font: inherit; font-size: 17px; font-weight: 500;
    color: var(--ink); background: none; border: 0; outline: none;
    padding: 15px 0;
  }
  .pick-field input::placeholder { color: var(--ink-3); font-weight: 400; }
  .pick-more {
    appearance: none; background: none; border: 0;
    font: inherit; font-size: 14px; font-weight: 600; color: var(--ink-3);
    cursor: pointer; padding: 6px 0 6px 12px; white-space: nowrap;
  }
  .pick-more:hover { color: var(--ink); }
  .pick-more:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .pick-list {
    position: absolute; top: calc(100% + 5px); left: 0; right: 0; z-index: 40;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 3px;
    max-height: 320px; overflow-y: auto;
    box-shadow: 0 18px 34px -22px rgba(28,35,51,.5);
  }
  .pick-list div[role="option"] {
    display: flex; align-items: baseline; gap: 12px;
    padding: 11px 16px; cursor: pointer;
    border-bottom: 1px solid var(--rule-2);
    font-size: 16px;
  }
  .pick-list div[role="option"]:last-child { border-bottom: 0; }
  .pick-list div.on { background: var(--mark-soft); }
  .pick-list .tally {
    margin-left: auto; font-size: 13.5px; color: var(--ink-3);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .pick-list .empty { padding: 20px 16px; color: var(--ink-3); }

  /* ---------- your standing ---------- */
  .standing {
    margin-top: 24px;
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 24px;
  }
  .standing .name {
    font-family: var(--serif); font-weight: 600; font-size: 24px;
    letter-spacing: -.015em; line-height: 1.1;
  }
  .standing .facts { font-size: 15px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .standing .facts b { font-weight: 700; color: var(--ink); }
  .standing .drop {
    margin-left: auto; appearance: none; background: none;
    border: 0; border-bottom: 1.5px solid var(--rule);
    font: inherit; font-size: 14px; font-weight: 600; color: var(--ink-3);
    cursor: pointer; padding: 2px 0;
  }
  .standing .drop:hover { color: var(--pen); border-bottom-color: var(--pen); }
  .standing .drop:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  /* ---------- view switch ---------- */
  .views {
    display: flex; gap: 26px; flex-wrap: wrap;
    margin-top: 26px;
    border-bottom: 2px solid var(--ink);
  }
  .views button {
    appearance: none; background: none; border: 0; cursor: pointer;
    font: inherit; font-size: 15.5px; font-weight: 600;
    color: var(--ink-3);
    padding: 0 0 10px;
    margin-bottom: -2px;
    border-bottom: 4px solid transparent;
    transition: color .12s ease;
  }
  .views button:hover { color: var(--ink); }
  .views button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--mark); }
  .views button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .tools { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
  .tool {
    appearance: none; cursor: pointer; font: inherit;
    font-size: 14px; font-weight: 600;
    background: none; color: var(--ink-3);
    border: 1.5px solid var(--rule); border-radius: 2px;
    padding: 7px 14px;
    transition: color .14s ease, border-color .14s ease;
  }
  .tool:hover { color: var(--ink); border-color: var(--ink-3); }
  .tool:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* ---------- search + filters on the full schedule ---------- */
  .searchbar {
    display: flex; align-items: center; gap: 12px;
    margin-top: 26px;
    background: var(--paper-2);
    border: 1.5px solid var(--rule);
    border-radius: 3px;
    padding: 0 16px;
  }
  .searchbar:focus-within { border-color: var(--ink); background: var(--paper); }
  .searchbar svg { flex: none; color: var(--ink-3); }
  .searchbar input {
    flex: 1; min-width: 0; font: inherit; font-size: 16px;
    color: var(--ink); background: none; border: 0; outline: none; padding: 13px 0;
  }
  .searchbar input::placeholder { color: var(--ink-3); }
  .searchbar .clear {
    appearance: none; background: none; border: 0; cursor: pointer;
    font: inherit; font-size: 13.5px; font-weight: 600; color: var(--ink-3);
    padding: 6px 0 6px 10px;
  }
  .searchbar .clear:hover { color: var(--pen); }

  /* the day strip: each tile carries one dot per exam that day */
  .strip {
    display: flex; gap: 8px; overflow-x: auto;
    margin-top: 18px; padding: 2px 1px 10px;
    scrollbar-width: thin;
  }
  .dtile {
    flex: 0 0 auto; width: 64px;
    appearance: none; cursor: pointer; font: inherit;
    background: var(--paper); color: var(--ink);
    border: 1.5px solid var(--rule); border-radius: 3px;
    padding: 8px 4px 7px; text-align: center;
    transition: border-color .12s ease, background .12s ease;
  }
  .dtile:hover { border-color: var(--ink-3); }
  .dtile:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .dtile .wd { display: block; font-size: 11.5px; font-weight: 600; color: var(--ink-3); }
  .dtile .dn {
    display: block; font-family: var(--serif); font-weight: 700;
    font-size: 25px; line-height: 1.08; letter-spacing: -.03em;
  }
  .dtile .mo { display: block; font-size: 11px; color: var(--ink-3); }
  .dtile .dots {
    display: flex; gap: 3px; justify-content: center; margin-top: 6px; min-height: 6px;
  }
  .dtile .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--ink-3); }
  .dtile .dots i.short { background: var(--pen); }
  .dtile.today { border-color: var(--mark-deep); }
  .dtile.gone { opacity: .45; }
  .dtile[aria-pressed="true"] {
    background: var(--mark); border-color: var(--ink);
  }
  .dtile[aria-pressed="true"] .wd,
  .dtile[aria-pressed="true"] .mo { color: var(--ink); }
  .dtile[aria-pressed="true"] .dots i { background: var(--ink); }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; }
  .filters .sep { width: 1px; height: 18px; background: var(--rule); margin: 0 4px; }
  .filters button {
    appearance: none; cursor: pointer; font: inherit;
    font-size: 13.5px; font-weight: 600;
    background: none; color: var(--ink-3);
    border: 1.5px solid var(--rule); border-radius: 2px;
    padding: 6px 12px;
    transition: color .12s ease, border-color .12s ease;
  }
  .filters button:hover { color: var(--ink); border-color: var(--ink-3); }
  .filters button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .filters button[aria-pressed="true"] {
    color: var(--ink); border-color: var(--ink); background: var(--mark-soft);
  }

  .count {
    margin: 22px 0 0; font-size: 14px; font-weight: 600; color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- the schedule ---------- */
  .day { margin-top: 40px; }
  .day-mark {
    display: flex; align-items: baseline; gap: 12px;
    padding-bottom: 9px;
    border-bottom: 1.5px solid var(--ink);
  }
  .day-mark .num {
    font-family: var(--serif); font-weight: 700;
    font-size: 30px; line-height: 1; letter-spacing: -.03em;
  }
  .day-mark .mon {
    font-family: var(--serif); font-weight: 400; font-size: 19px;
    color: var(--ink-2); letter-spacing: -.01em;
  }
  .day-mark .wd { font-size: 14.5px; color: var(--ink-3); font-weight: 500; }
  .day-mark .when { margin-left: auto; font-size: 13.5px; font-weight: 700; color: var(--ink-2); }
  .day.is-today .day-mark { border-bottom-color: var(--mark-deep); }
  .day.is-today .day-mark .when { color: var(--mark-deep); }

  .slot {
    display: grid;
    grid-template-columns: 74px 1fr auto;
    gap: 4px 16px;
    align-items: baseline;
    padding: 16px 0 15px;
    border-bottom: 1px solid var(--rule-2);
  }
  .slot:last-child { border-bottom: 0; }
  .slot.gone { opacity: .42; }

  .slot .at { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .slot .at small { display: block; font-size: 12.5px; font-weight: 500; color: var(--ink-3); letter-spacing: 0; }
  .slot .what { min-width: 0; }
  .slot .course { font-size: 17.5px; font-weight: 600; letter-spacing: -.012em; text-wrap: balance; }
  .slot .lead { font-size: 14px; color: var(--ink-3); margin-top: 2px; }
  .slot .where-all {
    font-size: 14.5px; font-weight: 700; color: var(--ink-2);
    font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap;
  }

  .team { grid-column: 2 / -1; margin-top: 11px; display: grid; gap: 2px; }
  .who {
    display: grid; grid-template-columns: 1fr auto;
    gap: 14px; align-items: baseline;
    padding: 4px 0;
    font-size: 15px; color: var(--ink-2);
  }
  .who .rm { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); letter-spacing: -.01em; }
  .who .rm.none { color: var(--ink-3); font-weight: 500; }
  .who.hole { color: var(--pen); }
  .who.hole .rm { color: var(--pen); }

  /* the highlighter: the one bold move on the page */
  .who.mine {
    position: relative;
    color: var(--ink); font-weight: 700;
    padding-left: 8px; padding-right: 8px;
    margin-left: -8px; margin-right: -8px;
  }
  .who.mine::before {
    content: "";
    position: absolute; inset: 1px 0 1px 0;
    background: var(--mark);
    border-radius: 2px 7px 3px 8px / 8px 3px 9px 2px;
    z-index: -1;
    transform: rotate(-.35deg);
  }
  .who.mine .rm { color: var(--ink); }
  .slot.has-mine .course { font-weight: 700; }

  .cal {
    grid-column: 2 / -1;
    margin-top: 10px;
    font-size: 13.5px; font-weight: 600;
    color: var(--ink-3); text-decoration: none;
    border-bottom: 1.5px solid var(--rule);
    justify-self: start; padding-bottom: 1px;
  }
  .cal:hover { color: var(--ink); border-bottom-color: var(--ink); }
  .cal:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  /* ---------- course view ---------- */
  .courses { display: grid; gap: 0; margin-top: 26px; }
  .course-row {
    appearance: none; text-align: left; cursor: pointer;
    background: none; border: 0; border-bottom: 1px solid var(--rule-2);
    font: inherit; color: var(--ink);
    padding: 14px 2px;
    display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: baseline;
  }
  .course-row:hover { background: var(--paper-2); }
  .course-row:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
  .course-row .nm { font-size: 16.5px; font-weight: 600; letter-spacing: -.01em; }
  .course-row .by { display: block; font-size: 13.5px; color: var(--ink-3); margin-top: 1px; font-weight: 400; }
  .course-row .sit { font-size: 13.5px; color: var(--ink-3); white-space: nowrap; }
  .course-row[aria-expanded="true"] { background: var(--mark-soft); }
  .course-detail { padding: 6px 2px 20px; border-bottom: 1px solid var(--rule-2); display: grid; gap: 16px; }
  .sitting .head { font-size: 14.5px; font-weight: 700; font-variant-numeric: tabular-nums; margin-bottom: 6px; }
  .sitting .head span { font-weight: 500; color: var(--ink-3); }


  .nothing {
    margin-top: 34px; padding: 38px 20px; text-align: center;
    border: 1.5px dashed var(--rule); color: var(--ink-3); font-size: 15.5px;
  }
  .nothing b { display: block; color: var(--ink-2); font-size: 17px; margin-bottom: 4px; font-weight: 600; }

  @media (max-width: 560px) {
    .sheet { padding: 0 18px 80px; }
    .masthead { padding-top: 34px; }
    .views { gap: 18px; }
    .slot { grid-template-columns: 60px 1fr; }
    .slot .where-all { grid-column: 2; text-align: left; margin-top: 2px; }
    .team, .cal { grid-column: 1 / -1; }
    .standing .drop { margin-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media print {
    .pick, .views, .tools, .cal, .standing .drop { display: none !important; }
    .who.mine::before { background: none; }
    .who.mine { text-decoration: underline; }
  }
</style>

<div class="sheet">
  <header class="masthead">
    <h1>Exam duty</h1>
    <p class="where">School of Engineering &amp; Technology, Al Hussein Technical University.</p>

    <div class="pick" id="pick">

  </header>

  <main id="body"></main>

        "Coordinator: " + (e.coordinator || "not listed") + ".")
    ].join("&");
  }

  /* ---------- picker ---------- */
  var input = document.getElementById("q");
  var opts = document.getElementById("opts");

  function paintOpts(q) {
    q = (q || "").toLowerCase().trim();
    var list = DATA.proctorIndex.filter(function (p) {
      return !q || p.name.toLowerCase().indexOf(q) > -1;
    });
    opts.innerHTML = list.length
      ? list.map(function (p, i) {
          return '<div role="option" aria-selected="false" class="' + (i === 0 ? "on" : "") +
            '" data-name="' + esc(p.name) + '">' + esc(p.name) +
            '<span class="tally">' + (p.count ? p.count + (p.count === 1 ? " duty" : " duties")
                                              : "none this period") + "</span></div>";
        }).join("")
      : '<div class="empty">No one by that name.</div>';
  }
  function openOpts(q) { paintOpts(q); opts.hidden = false; input.setAttribute("aria-expanded", "true"); }
  function shutOpts() { opts.hidden = true; input.setAttribute("aria-expanded", "false"); }

  input.addEventListener("input", function () { openOpts(input.value); });
  input.addEventListener("focus", function () { if (input.value) openOpts(input.value); });
  document.getElementById("more").addEventListener("click", function () {
    if (opts.hidden) { openOpts(input.value); input.focus(); } else { shutOpts(); }
  });
  opts.addEventListener("click", function (ev) {
    var row = ev.target.closest("[data-name]");
    if (row) choose(row.dataset.name);
  });
  input.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") { shutOpts(); return; }
    var rows = Array.prototype.slice.call(opts.querySelectorAll("[data-name]"));
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      ev.preventDefault();
      if (opts.hidden) { openOpts(input.value); return; }
      if (!rows.length) return;
      var i = rows.findIndex(function (r) { return r.classList.contains("on"); });
      rows.forEach(function (r) { r.classList.remove("on"); });
      i = ev.key === "ArrowDown" ? (i + 1) % rows.length : (i - 1 + rows.length) % rows.length;
      rows[i].classList.add("on");
      rows[i].scrollIntoView({ block: "nearest" });
    } else if (ev.key === "Enter") {
      ev.preventDefault();
      var on = !opts.hidden && opts.querySelector(".on");
      if (on) choose(on.dataset.name);
    }
  });
  document.addEventListener("click", function (ev) {
    if (!ev.target.closest("#pick")) shutOpts();
  });

  function choose(name) {
    state.me = name;
    state.view = "mine";
    input.value = "";
    shutOpts();
    render();
  }

  /* ---------- pieces ---------- */
  function slotHtml(e, opt) {
    opt = opt || {};
    var mineHere = state.me && e.proctors.indexOf(state.me) > -1;
    var out = ['<div class="slot' + (past(e) ? " gone" : "") + (mineHere ? " has-mine" : "") + '">'];

    out.push('<div class="at">' + esc(e.start || "—") +
             (e.end ? "<small>to " + esc(e.end) + "</small>" : "") + "</div>");

    out.push('<div class="what"><div class="course">' + esc(e.course) + "</div>");
    var lead = [];
    if (e.coordinator) lead.push(esc(e.coordinator));
    if (e.students != null) lead.push(e.students + " students");
    if (lead.length) out.push('<div class="lead">' + lead.join(" &middot; ") + "</div>");
    out.push("</div>");

    var rooms = e.rooms && e.rooms.length ? e.rooms : [];
    // In My duties the only room that matters is yours, so name it here.
    if (opt.onlyMyRoom) {
      var mine = myRoom(e, state.me);
      out.push('<div class="where-all">' + (mine ? esc(mine) : "room to come") + "</div>");
    } else {
      out.push('<div class="where-all">' + (rooms.length > 1 ? rooms.length + " rooms" : "") + "</div>");
    }

    if (!opt.onlyMyRoom) {
      var team = (e.assignments || []).map(function (a) {
        var isMe = state.me && a.name === state.me;
        return '<div class="who' + (isMe ? " mine" : "") + '"><span>' + esc(a.name) + "</span>" +
               '<span class="rm' + (a.room ? "" : " none") + '">' +
               (a.room ? esc(a.room) : "room to come") + "</span></div>";
      });
      (e.spareRooms || []).forEach(function (rm) {
        team.push('<div class="who hole"><span>Nobody assigned</span>' +
                  '<span class="rm">' + esc(rm) + "</span></div>");
      });
      var ghosts = (e.shortfall || 0) - (e.spareRooms || []).length;
      for (var i = 0; i < ghosts; i++) {
        team.push('<div class="who hole"><span>Nobody assigned</span>' +
                  '<span class="rm">room to come</span></div>');
      }
      if (team.length) out.push('<div class="team">' + team.join("") + "</div>");
    }

    if (mineHere && !past(e)) {
      var u = gcal(e, state.me);
      if (u) out.push('<a class="cal" href="' + u + '" target="_blank" rel="noopener">Add to your calendar</a>');
    }

    out.push("</div>");
    return out.join("");
  }

  function rosterHtml(rows, opt) {
    var out = [], cur = null;
    rows.forEach(function (e) {
      if (e.date !== cur) {
        if (cur !== null) out.push("</div>");
        cur = e.date;
        var d = asDate(e.date), w = whenWord(e.date);
        out.push('<div class="day' + (dayGap(e.date) === 0 ? " is-today" : "") + '">' +
          '<div class="day-mark">' +
            '<span class="num">' + (d ? d.getDate() : "—") + "</span>" +
            '<span class="mon">' + (d ? MON[d.getMonth()] : "Date not set") + "</span>" +
            '<span class="wd">' + (d ? WD[d.getDay()] : "") + "</span>" +
            (w ? '<span class="when">' + w + "</span>" : "") +
          "</div>");
      }
      out.push(slotHtml(e, opt));
    });
    out.push("</div>");
    return out.join("");
  }

  /* ---------- views ---------- */
  // Every date that has an exam, for the strip along the top.
  var DATES = (function () {
    var seen = {}, out = [];
    DATA.exams.forEach(function (e) {
      if (e.date && asDate(e.date) && !seen[e.date]) { seen[e.date] = 1; out.push(e.date); }
    });
    return out.sort();
  })();

  function stripHtml() {
    return '<div class="strip">' + DATES.map(function (iso) {
      var on = DATA.exams.filter(function (e) { return e.date === iso; });
      var d = asDate(iso);
      var cls = ["dtile"];
      if (dayGap(iso) === 0) cls.push("today");
      if (asDate(iso) < TODAY) cls.push("gone");
      var dots = on.slice(0, 7).map(function (e) {
        return '<i class="' + (e.shortfall ? "short" : "") + '"></i>';
      }).join("");
      return '<button class="' + cls.join(" ") + '" data-day="' + iso +
        '" aria-pressed="' + (state.day === iso) + '" title="' + on.length +
        (on.length === 1 ? " exam" : " exams") + '">' +
        '<span class="wd">' + WD[d.getDay()].slice(0, 3) + "</span>" +
        '<span class="dn">' + d.getDate() + "</span>" +
        '<span class="mo">' + MON[d.getMonth()].slice(0, 3) + "</span>" +
        '<span class="dots">' + dots + "</span></button>";
    }).join("") + "</div>";
  }

  function viewAll() {
    var q = state.q.toLowerCase().trim();

    var depts = [];
    DATA.exams.forEach(function (e) { if (e.dept && depts.indexOf(e.dept) < 0) depts.push(e.dept); });
    depts.sort();

    var rows = DATA.exams.filter(function (e) {
      if (state.day && e.date !== state.day) return false;
      if (state.dept && e.dept !== state.dept) return false;
      if (!state.day) {
        if (state.scope === "upcoming" && past(e)) return false;
        if (state.scope === "done" && !past(e)) return false;
      }
      if (!q) return true;
      return (e.course + " " + e.coordinator + " " + e.room + " " + e.dept + " " +
              e.proctors.join(" ")).toLowerCase().indexOf(q) > -1;
    });

    var out = [];
    out.push('<div class="searchbar">' +
      '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" ' +
      'stroke-width="1.7" aria-hidden="true"><circle cx="7" cy="7" r="4.6"/><path d="M10.4 10.4 14 14"/></svg>' +
      '<input id="find" type="text" autocomplete="off" placeholder="Search a course, room, ' +
      'coordinator or proctor" value="' + esc(state.q) + '">' +
      (state.q ? '<button class="clear" id="clearq">Clear</button>' : "") + "</div>");

    out.push(stripHtml());

    out.push('<div class="filters">');
    [["upcoming", "Still to come"], ["all", "Everything"], ["done", "Finished"]].forEach(function (s) {
      out.push('<button data-scope="' + s[0] + '" aria-pressed="' +
               (!state.day && state.scope === s[0]) + '">' + s[1] + "</button>");
    });
    if (depts.length) {
      out.push('<span class="sep"></span>');
      out.push('<button data-dept="" aria-pressed="' + (!state.dept) + '">All departments</button>');
      depts.forEach(function (d) {
        out.push('<button data-dept="' + esc(d) + '" aria-pressed="' +
                 (state.dept === d) + '">' + esc(d) + "</button>");
      });
    }
    if (state.day) {
      out.push('<span class="sep"></span><button data-day="">Show every day</button>');
    }
    out.push("</div>");

    out.push('<p class="count">' + rows.length + (rows.length === 1 ? " exam" : " exams") +
      (state.day ? " on " + esc(prettyDay(state.day)) : "") + "</p>");

    out.push(rows.length ? rosterHtml(rows)
      : '<div class="nothing"><b>Nothing matches</b>Try a different search, or clear the filters.</div>');

    return out.join("");
  }

  function prettyDay(iso) {
    var d = asDate(iso);
    return d ? WD[d.getDay()] + " " + d.getDate() + " " + MON[d.getMonth()] : iso;
  }

  function viewMine() {
    if (!state.me) {
      return '<div class="nothing"><b>Nobody chosen yet</b>' +
             "Find your name above and this becomes your own list of duties.</div>";
    }
    var mine = duties(state.me);
    if (!mine.length) {
      return '<div class="nothing"><b>Nothing for you this period</b>' +
             esc(state.me) + " has no proctoring duties between now and the end of the exams.</div>";
    }
    return '<div class="tools"><button class="tool" id="copy">Copy your duties</button></div>' +
           rosterHtml(mine, { onlyMyRoom: true });
  }

  function viewCourse() {
    var out = ['<div class="courses">'];
    DATA.courseIndex.forEach(function (c) {
      var open = state.course === c.course;
      out.push('<button class="course-row" data-course="' + esc(c.course) + '" aria-expanded="' + open + '">' +
        '<span><span class="nm">' + esc(c.course) + "</span>" +
        (c.coordinator ? '<span class="by">' + esc(c.coordinator) + "</span>" : "") + "</span>" +
        '<span class="sit">' + c.sittings.length +
        (c.sittings.length === 1 ? " sitting" : " sittings") + "</span></button>");

      if (open) {
        out.push('<div class="course-detail">');
        DATA.exams.filter(function (e) { return e.course === c.course; }).forEach(function (e) {
          var d = asDate(e.date);
          out.push('<div class="sitting"><div class="head">' +
            (d ? WD[d.getDay()] + " " + d.getDate() + " " + MON[d.getMonth()] : "date to come") +
            " <span>" + esc(e.time) + "</span></div>");
          var team = (e.assignments || []).map(function (a) {
            var isMe = state.me && a.name === state.me;
            return '<div class="who' + (isMe ? " mine" : "") + '"><span>' + esc(a.name) + "</span>" +
                   '<span class="rm' + (a.room ? "" : " none") + '">' +
                   (a.room ? esc(a.room) : "room to come") + "</span></div>";
          });
          (e.spareRooms || []).forEach(function (rm) {
            team.push('<div class="who hole"><span>Nobody assigned</span>' +
                      '<span class="rm">' + esc(rm) + "</span></div>");
          });
          out.push(team.join("") ||
            '<div class="who hole"><span>No proctors yet</span><span class="rm"></span></div>');
          out.push("</div>");
        });
        out.push("</div>");
      }
    });
    out.push("</div>");
    return out.join("");
  }

  /* ---------- render ---------- */
  function renderStanding() {
    var box = document.getElementById("standing");
    if (!state.me) { box.innerHTML = ""; return; }

    var mine = duties(state.me);
    var ahead = mine.filter(function (e) { return !past(e); });
    var next = ahead[0];
    var bits = ['<div class="standing"><span class="name">' + esc(state.me) + "</span>"];

    if (mine.length) {
      var f = "<b>" + ahead.length + "</b> " + (ahead.length === 1 ? "duty" : "duties") + " left";
      f += " &middot; <b>" + hoursOf(ahead) + "</b> hours";
      if (next) {
        var rm = myRoom(next, state.me);
        f += " &middot; next " + esc(next.day) + " " + esc(next.start) +
             (rm ? ' in <b style="white-space:nowrap">' + esc(rm) + "</b>" : "");
      }
      bits.push('<span class="facts">' + f + "</span>");
    } else {
      bits.push('<span class="facts">No duties in this exam period.</span>');
    }
    bits.push('<button class="drop" id="drop">Not you?</button></div>');
    box.innerHTML = bits.join("");
  }

  function render() {
    Array.prototype.forEach.call(document.querySelectorAll(".views button"), function (b) {
      b.setAttribute("aria-selected", String(b.dataset.view === state.view));
    });
    renderStanding();
    document.getElementById("body").innerHTML =
      state.view === "mine" ? viewMine() :
      state.view === "course" ? viewCourse() : viewAll();
    writeHash();
  }

  /* ---------- events ---------- */
  document.querySelector(".views").addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-view]");
    if (!b || b.dataset.view === state.view) return;
    state.view = b.dataset.view;
    render();
  });

  // Typing re-renders the list, so put the caret back where it was.
  document.getElementById("body").addEventListener("input", function (ev) {
    if (ev.target.id !== "find") return;
    var caret = ev.target.selectionStart;
    state.q = ev.target.value;
    render();
    var again = document.getElementById("find");
    if (again) { again.focus(); again.setSelectionRange(caret, caret); }
  });

  document.getElementById("body").addEventListener("click", function (ev) {
    var b = ev.target.closest("button");
    if (!b) return;
    if (b.dataset.day !== undefined) {
      state.day = b.dataset.day === state.day ? "" : b.dataset.day;
      render();
    } else if (b.dataset.scope !== undefined) {
      state.scope = b.dataset.scope; state.day = ""; render();
    } else if (b.dataset.dept !== undefined) {
      state.dept = b.dataset.dept; render();
    } else if (b.id === "clearq") {
      state.q = ""; render();
      var f = document.getElementById("find"); if (f) f.focus();
    } else if (b.dataset.course !== undefined) {
      state.course = state.course === b.dataset.course ? "" : b.dataset.course;
      render();
    } else if (b.id === "copy") {
      var mine = duties(state.me);
      var txt = "Exam duty — " + state.me + "\n\n" + mine.map(function (e) {
        var d = asDate(e.date), rm = myRoom(e, state.me);
        return (d ? d.getDate() + " " + MON[d.getMonth()] : "?") + ", " + e.day +
               "  " + e.time + "  " + e.course + "  " + (rm ? "room " + rm : "room to come");
      }).join("\n");
      var done = function (m) { b.textContent = m; setTimeout(function () { b.textContent = "Copy your duties"; }, 1700); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(function () { done("Copied"); },
                                                function () { done("Could not copy"); });
      } else { done("Not supported here"); }
    }
  });

  document.body.addEventListener("click", function (ev) {
    if (ev.target.id === "drop") { state.me = ""; state.view = "all"; render(); input.focus(); }
  });

  /* ---------- links ---------- */
  function readHash() {
    var m = decodeURIComponent(location.hash.replace(/^#/, "")).match(/^p=([\s\S]*)$/);
    if (m && m[1]) { state.me = m[1]; state.view = "mine"; }
  }
  function writeHash() {
    try {
      history.replaceState(null, "",
        state.me ? "#p=" + encodeURIComponent(state.me) : location.pathname + location.search);
    } catch (err) { /* some hosts block history writes */ }
  }
  window.addEventListener("hashchange", function () { readHash(); render(); });

  /* ---------- start ---------- */
  (function setSpan() {
    // Only dates that actually parse. A stray character in one Date cell once
    // took the whole page down here, so nothing downstream trusts this input.
    var ds = DATA.exams
      .map(function (e) { return e.date; })
      .filter(function (d) { return asDate(d); })
      .sort();
    if (!ds.length) return;
    var a = asDate(ds[0]), b = asDate(ds[ds.length - 1]);
    if (!a || !b) return;
    document.getElementById("span").textContent =
      a.getDate() + " " + MON[a.getMonth()] + " – " + b.getDate() + " " +
      MON[b.getMonth()] + " " + b.getFullYear();
  })();

  readHash();
  render();
})();
</script>

</body>
</html>
